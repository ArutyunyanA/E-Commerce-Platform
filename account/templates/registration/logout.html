{% extends "webshop/base.html" %}

{% block title %}Logged out{% endblock %}

{% block content %}
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm text-center">
                    <div class="card-header bg-secondary text-white">
                        <h4 class="mb-0">You are logged out</h4>
                    </div>
                    <div class="card-body">
                        <p class="mb-3">You have been successfully logged out.</p>
                        <a href="{% url 'account:login' %}" class="btn btn-primary w-100">
                            Log in again
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
